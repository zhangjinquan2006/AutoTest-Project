name: Auto Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 下载代码
      uses: actions/checkout@v3

    - name: 安装 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安装依赖库
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests pymysql selenium webdriver-manager

    - name: 运行 Pytest 自动化测试
      run: |
        pytest -v
